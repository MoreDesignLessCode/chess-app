# Fly.io config for the Chesser online server.
# Change `app` to your own unique name the first time (fly launch will ask).
app = "chesser-server"
primary_region = "iad"   # pick one near you: iad (US-East), lax (US-West), lhr (London), etc.

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero when idle (free) and wake up on the next connection.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
